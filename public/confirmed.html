<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Email Confirmed — Vibe Remote</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      margin:0;font-family:system-ui,-apple-system,'Inter',sans-serif;
      background:#082134;color:#fff;
      display:grid;place-items:center;min-height:100vh
    }
    .card{
      text-align:center;padding:48px 40px;
      background:#143753;
      border:1px solid rgba(255,255,255,.1);
      border-radius:16px;max-width:420px;width:90%;
      box-shadow:0 10px 40px rgba(0,0,0,.4)
    }
    .logo-box{
      width:64px;height:64px;border-radius:22px;
      background:#164269;
      display:flex;align-items:center;justify-content:center;
      margin:0 auto 12px
    }
    .logo-box svg{display:block}
    h1{
      font-size:32px;font-weight:700;
      margin-bottom:4px;letter-spacing:-.3px
    }
    .sub{
      font-size:15px;color:rgba(255,255,255,.65);
      margin-bottom:24px
    }
    .check{font-size:48px;margin:16px 0;color:#27E07E}
    p{
      font-size:15px;color:rgba(255,255,255,.65);
      line-height:1.5;margin:0 0 32px
    }
    .btn{
      display:inline-block;width:100%;height:52px;line-height:52px;
      border-radius:999px;background:#27E07E;
      color:#082134;font-size:15px;font-weight:700;
      text-decoration:none;border:none;cursor:default
    }
  </style>
</head>
